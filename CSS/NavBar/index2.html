<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #383434;
            color: #fff;
        }
        .nav-container{
            margin-bottom: 10px;
            width: 1000px;
        }
        .nav1 {
             width: 100px;
             border-radius: 5px;
             border: 2px solid black;
             background-color: #771c1c;
             padding: 10px;
             width: 20%;
        }
        .nav1 ul{
            list-style-type: none;
            margin: 0;
            padding: 10px;
        }
        .nav1 li{
            margin-bottom: 12px;

        }
        .nav1 a{
            text-decoration: none;
            color: #fff;
            display: block;
            padding: 2px;
            width: 100%;
        }
        .nav1 a:hover{
            color: black;
            font-size: larger;
            border-radius: 5px;
            padding: 5px;
            background-color: hsl(0, 45%, 70%);
        }
        .nav1 .login-btn{
            border: 2px solid rgb(56, 10, 10);
            border-radius: 10px;
            background-color: #8a7b7b;
            padding: 10px;
            width: 100%;
            cursor: pointer;

        }
        .nav1 .login-btn:hover {
            border: 2px solid black;
            background-color: #834444;
            color: #fff;
        }
        

    </style>
</head>
<body>
    <div class="nav-container">
        <h2>Verical : Hover Effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Mission</a></li>
                <li><a href="#">SkinCare</a></li>
                <li><a href="#">HairCare</a></li>
                <li><a href="#">Men Store</a></li>
                <li><a href="#">Women Store</a></li>
                <li><a href="#">Gifts</a></li>
                <li><a href="#">Perfume</a></li>
                <li><a href="#">AI Assistant</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><button class="login-btn">Profile</button></li>
            </ul>
        </nav>
    </div>
    
</body>
</html>
