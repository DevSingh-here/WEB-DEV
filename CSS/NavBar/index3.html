<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 10px;
            padding: 0;
            background-color: #383434;
            color: #fff;
        }
        .nav-container{
            margin-bottom: 10px;
        }
        .nav1{
            background-color: #359add;
            border-radius: 12px;
            padding: 10px;
           
        }
        .nav1 ul{
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            
        }
        .nav1 .dropdown-content{
            display: none;
        }
        .nav1 a:hover{
            background-color: #1e5f8a;
            border-radius: 5px;
            color: rgb(24, 23, 23);
        }
        .nav1 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: #2879af;
            border-radius: 5px;
            min-width: 150px;
        }
        .nav1 .dropdown .dropdown-content a:hover::after {
            content: " 🔗";
        }
        .nav1 .dropdown .dropdown-content a:hover{
            background-color: #1e5f8a;
            border-radius: 2px;
            color: black;
        }

        .nav1 a{
            text-decoration: none;
            color: #fff;
            display: block;
            padding: 10px;
        }
        .nav1 .login-btn{
            background-color: #3686e2;
            padding: 7px 10px;
            border-radius: 5px;
            border: 1px solid rgb(41, 38, 38);
        }
        .nav1 .login-btn:hover{
            font-weight: bold;
            background-color: #2561a5;
            cursor: pointer;
            color: white;
            border: 2px solid black;
        }
        
        
    </style>
</head>
<body>
    <div class="nav-container">
        <h2>Horizontal : Dropdown Effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="dropdown">
                    <a href="#">About</a>
                    <div class="dropdown-content">
                        <a href="#">Origin</a>
                        <a href="#">Future</a>
                        <a href="#">Contact Us</a>
                    </div>
                </li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
    
</body>
</html>
