<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../../src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-800 shadow-2xl  rounded-lg p-12 shadow-lg max-w-sm w-full ">
        <h2 class="text-3xl text-center text-gray-400 mb-4 font-bold">PROFILE</h2>
        <form >
            <div class="mb-4">
                <label class="block mb-1 font-medium text-gray-400 w-full" for="">Email</label>
                <input  class="border-1 focus:outline-none focus:ring-2 focus:ring-gray-400 shadow-2xl  border-gray-700 w-full p-2 bg-gray-600 rounded-md text-gray-300" type="email" name="" placeholder="Email">
            </div>
            <div>
                <label class="block mb-1 font-medium text-gray-400 " for="">Password</label>
                <input class="border-1 focus:outline-none focus:ring-2 focus:ring-gray-400 shadow-2xl  border-gray-700 w-full p-2 bg-gray-600 rounded-md text-gray-300" type="password" name="" placeholder="Password">
            </div>
            <button class="w-full bg-blue-600 p-2 rounded-md mt-4 text-gray-400 hover:bg-blue-800 font-bold hover:cursor-pointer shadow-2xl " type="submit">Login</button>
        </form>
    </div>
</body>
</html>
